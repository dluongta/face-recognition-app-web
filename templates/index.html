<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Recognition App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* Bổ sung CSS nhỏ cho danh sách database và form */
        .db-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #eee; }
        .db-info { display: flex; flex-direction: column; }
        .db-name { font-weight: bold; font-size: 16px; }
        .db-count { font-size: 13px; color: #fff; }
        .search-box { width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-small { padding: 5px 10px; font-size: 13px; cursor: pointer; border: none; border-radius: 4px; color: white; background-color: #f44336; }
        .stats { margin-bottom: 15px; font-size: 14px; color: #ffffff; font-weight: bold; }        .visual-container { position: relative; margin-top: 15px; display: flex; justify-content: center; background: #f0f0f0; border-radius: 8px; overflow: hidden;}
        #video, #verifyCanvas { max-width: 100%; height: auto; }
    </style>
</head>
<body>

<div class="container">
    <h1>FACE RECOGNITION</h1>

    <!-- ================================================= -->
    <!-- REGISTER -->
    <!-- ================================================= -->
    <section class="panel">
        <h2>Đăng ký khuôn mặt</h2>
        <div class="form-row">
            <input type="text" id="personName" placeholder="Nhập tên người...">
            <input type="file" id="registerImages" accept="image/*" multiple>
            <button class="btn blue" onclick="registerPerson()">Tải lên & Đăng ký</button>
        </div>
        <div id="registerStatus"></div>
    </section>

    <!-- ================================================= -->
    <!-- DATABASE -->
    <!-- ================================================= -->
    <section class="panel">
        <h2>Dữ liệu khuôn mặt</h2>
        <input type="text" id="searchInput" class="search-box" placeholder="Tìm kiếm tên..." onkeyup="filterDatabase()">
        <div id="databaseStats" class="stats"></div>
        <div id="databaseList"></div>
    </section>

    <!-- ================================================= -->
    <!-- RECOGNITION (UPLOAD & CAMERA) -->
    <!-- ================================================= -->
    <section class="panel">
        <h2>Nhận diện khuôn mặt</h2>
        <div class="form-row">
            <!-- Upload File -->
            <input type="file" id="verifyImage" accept="image/*" style="display: none;" onchange="verifyUploadedImage()">
            <button class="btn purple" onclick="document.getElementById('verifyImage').click()">Tải ảnh lên</button>
            
            <!-- Camera -->
            <button class="btn green" id="startCameraBtn" onclick="startCamera()">Mở Camera</button>
            <button class="btn orange" id="captureBtn" onclick="captureAndVerify()" style="display: none;">Chụp & Nhận diện</button>
            <button class="btn red" id="stopCameraBtn" onclick="stopCamera()" style="display: none;">Tắt Camera</button>
        </div>

        <div id="verifyResult" class="result-box" style="margin-top: 15px; white-space: pre-line;"></div>
        
        <div class="visual-container">
            <video id="video" autoplay playsinline muted style="display: none;"></video>
            <canvas id="verifyCanvas"></canvas>
        </div>
    </section>

    <!-- <footer style="margin-top: 20px; text-align: center;">
        Xanh = Đã nhận diện <span class="green-text" style="color: #00c853;">■</span>
        &nbsp;&nbsp;
        Đỏ = Unknown <span class="red-text" style="color: #ff1744;">■</span>
    </footer> -->
    
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
