<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Recognition App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>FACE RECOGNITION</h1>

    <!-- ================================================= -->
    <!-- REGISTER -->
    <!-- ================================================= -->
    <section class="panel">
        <h2>Đăng ký khuôn mặt</h2>
        <div class="form-row">
            <input type="text" id="personName" placeholder="Nhập tên người...">
            <input type="file" id="registerImages" accept="image/*" multiple>
            <button class="btn blue" onclick="registerPerson()">Tải lên & Đăng ký</button>
        </div>
        <div id="registerStatus"></div>
    </section>

    <!-- ================================================= -->
    <!-- DATABASE -->
    <!-- ================================================= -->
    <section class="panel">
        <h2>Dữ liệu khuôn mặt</h2>
        <input type="text" id="searchInput" class="search-box" placeholder="Tìm kiếm tên..." onkeyup="filterDatabase()">
        <div id="databaseStats" class="stats"></div>
        
        <!-- Bảng hiển thị dữ liệu có thanh cuộn -->
        <div class="table-wrapper">
            <div class="table-header">
                <div class="col-name">Tên khuôn mặt</div>
                <div class="col-action">Thao tác</div>
            </div>
            <!-- Dữ liệu từ JS sẽ được đẩy vào trong div này -->
            <div id="databaseList"></div>
        </div>
    </section>

    <!-- ================================================= -->
    <!-- RECOGNITION (UPLOAD & CAMERA) -->
    <!-- ================================================= -->
    <section class="panel">
        <h2>Nhận diện khuôn mặt</h2>
        <div class="form-row">
            <!-- Upload File -->
            <input type="file" id="verifyImage" accept="image/*" style="display: none;" onchange="verifyUploadedImage()">
            <button class="btn purple" onclick="document.getElementById('verifyImage').click()">Tải ảnh lên</button>
            
            <!-- Camera -->
            <button class="btn green" id="startCameraBtn" onclick="startCamera()">Mở Camera</button>
            <button class="btn orange" id="captureBtn" onclick="captureAndVerify()" style="display: none;">Chụp & Nhận diện</button>
            <button class="btn red" id="stopCameraBtn" onclick="stopCamera()" style="display: none;">Tắt Camera</button>
        </div>

        <div id="verifyResult" class="result-box" style="margin-top: 15px; white-space: pre-line;"></div>
        
        <div class="visual-container">
            <video id="video" autoplay playsinline muted style="display: none;"></video>
            <canvas id="verifyCanvas"></canvas>
        </div>
    </section>

</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
